<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สำรวจไซส์เสื้อ-กางเกงนักศึกษา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1f3a5f;--line:#c9d4e2;--ink:#17202b;--ok:#1b7f4b;--err:#b3261e;--bg:#f5f7fa;--card:#fff;--on:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a212b;--ink:#e8edf3;--line:#34404f;--navy:#7fa6d9;--on:#10151c}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;line-height:1.6}
  main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:1.5rem;margin:8px 0 4px;color:var(--navy)}
  p.lead{margin:0 0 20px;opacity:.8}
  form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
  label.f,.legend{display:block;font-weight:600;margin:14px 0 6px}
  input[type=text],input[type=tel],textarea{width:100%;padding:10px 12px;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px}
  input:focus-visible,textarea:focus-visible,button:focus-visible,.chip input:focus-visible+span{outline:3px solid var(--navy);outline-offset:2px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip input{position:absolute;opacity:0;pointer-events:none}
  .chip span{display:inline-block;min-width:52px;text-align:center;padding:9px 14px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;user-select:none}
  .chip input:checked+span{background:var(--navy);border-color:var(--navy);color:var(--on);font-weight:700}
  .hint{font-size:.85rem;opacity:.7;margin:2px 0 0}
  button.submit{margin-top:22px;width:100%;padding:13px;font:inherit;font-weight:700;color:var(--on);background:var(--navy);border:0;border-radius:8px;cursor:pointer}
  button.submit:disabled{opacity:.6;cursor:wait}
  #msg{margin-top:14px;padding:10px 12px;border-radius:8px;display:none}
  #msg.ok{display:block;background:#e3f4ea;color:var(--ok)}
  #msg.err{display:block;background:#fbe9e7;color:var(--err)}
</style>
</head>
<body>
<main>
  <h1>สำรวจไซส์เสื้อและกางเกงนักศึกษา</h1>
  <p class="lead">กรอกข้อมูลและเลือกไซส์ที่ต้องการ หากเคยกรอกแล้ว ระบบจะอัปเดตข้อมูลเดิมตามรหัสนักศึกษา</p>

  <form id="f" novalidate>
    <label class="f" for="studentId">รหัสนักศึกษา</label>
    <input type="text" id="studentId" inputmode="numeric" autocomplete="off" required>

    <label class="f" for="name">ชื่อ-นามสกุล</label>
    <input type="text" id="name" autocomplete="name" required>

    <div class="legend">เพศ</div>
    <div class="chips">
      <label class="chip"><input type="radio" name="gender" value="ชาย"><span>ชาย</span></label>
      <label class="chip"><input type="radio" name="gender" value="หญิง"><span>หญิง</span></label>
    </div>

    <div class="legend">ไซส์เสื้อนักศึกษา</div>
    <div class="chips" id="shirtChips"></div>
    <p class="hint">ไซส์เสื้อเป็นขนาดรอบอก/ตัวเสื้อตามตารางของผู้ผลิต</p>

    <div class="legend">ไซส์กางเกง / กระโปรง (รอบเอว นิ้ว)</div>
    <div class="chips" id="pantsChips"></div>

    <label class="f" for="phone">เบอร์โทร (ไม่บังคับ)</label>
    <input type="tel" id="phone" inputmode="tel" autocomplete="tel">

    <label class="f" for="note">หมายเหตุ (ไม่บังคับ)</label>
    <textarea id="note" rows="2"></textarea>

    <button type="submit" class="submit" id="btn">บันทึกไซส์</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
</main>

<script>
  // ▼▼ วางลิงก์ Web app ของ Google Apps Script (ลงท้ายด้วย /exec) ตรงนี้ ▼▼
  const GAS_URL = 'วางลิงก์ /exec ที่นี่';

  // ▼▼ แก้รายการไซส์ได้ที่นี่ (ต้องตรงกับ CONFIG ใน Code.gs) ▼▼
  const SHIRT_SIZES = ['SS', 'S', 'M', 'L', 'XL', '2XL', '3XL', '4XL'];
  const PANTS_SIZES = ['26', '28', '30', '32', '34', '36', '38', '40', '42'];

  const $ = id => document.getElementById(id);
  const checked = n => (document.querySelector(`input[name="${n}"]:checked`) || {}).value || '';

  function renderChips(el, name, list) {
    el.innerHTML = list.map(v =>
      `<label class="chip"><input type="radio" name="${name}" value="${v}"><span>${v}</span></label>`).join('');
  }
  renderChips($('shirtChips'), 'shirt', SHIRT_SIZES);
  renderChips($('pantsChips'), 'pants', PANTS_SIZES);

  function showMsg(type, text) { $('msg').className = type; $('msg').textContent = text; }
  function setBusy(b) { $('btn').disabled = b; $('btn').textContent = b ? 'กำลังบันทึก...' : 'บันทึกไซส์'; }

  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const data = {
      studentId: $('studentId').value.trim(),
      name: $('name').value.trim(),
      gender: checked('gender'),
      shirt: checked('shirt'),
      pants: checked('pants'),
      phone: $('phone').value.trim(),
      note: $('note').value.trim()
    };
    if (!data.studentId || !data.name) return showMsg('err', 'กรุณากรอกรหัสนักศึกษาและชื่อ-นามสกุล');
    if (!data.shirt) return showMsg('err', 'กรุณาเลือกไซส์เสื้อ');
    if (!data.pants) return showMsg('err', 'กรุณาเลือกไซส์กางเกง');
    if (!GAS_URL.startsWith('https://script.google.com/')) return showMsg('err', 'ยังไม่ได้ตั้งค่าลิงก์ GAS_URL ในไฟล์ index.html');

    setBusy(true);
    try {
      // ใช้ text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script ไม่รองรับ
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });
      const r = await res.json();
      if (!r.ok) throw new Error(r.message);
      showMsg('ok', r.message);
      $('f').reset();
    } catch (e) {
      showMsg('err', 'บันทึกไม่สำเร็จ: ' + e.message);
    } finally {
      setBusy(false);
    }
  });
</script>
</body>
</html>
